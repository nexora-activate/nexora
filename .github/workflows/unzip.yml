name: Extract nexora-render-v2.zip
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract archive to repository root
        run: |
          ls -la
          unzip -o nexora-render-v2.zip
          rm -f nexora-render-v2.zip
          for d in */; do
            if [ -f "${d}package.json" ] && [ -f "${d}render.yaml" ] && [ -d "${d}client" ] && [ -d "${d}server" ]; then
              shopt -s dotglob
              mv "${d}"* .
              rmdir "$d"
            fi
          done
          ls -la
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git diff --cached --quiet || git commit -m "Extract nexora-render-v2.zip contents to repository root"
          git push
